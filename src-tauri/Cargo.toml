[package]
name = "activity-view"
version = "0.1.0"
description = "Local ActivityWatch analytics dashboard"
authors = ["Wes Wei"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "activity_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Every ActivityWatch read goes through reqwest on the Rust side, which is what
# makes the dashboard immune to the watcher's missing CORS headers.
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
