[package]
name = "activity-view"
version = "0.1.1"
description = "Local ActivityWatch analytics dashboard"
authors = ["Wes Wei"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "activity_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Every ActivityWatch read goes through reqwest on the Rust side, which is what
# makes the dashboard immune to the watcher's missing CORS headers.
tauri-plugin-http = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WebView2 keeps a browser's keyboard (F5, Ctrl+R, Ctrl+P, Ctrl+F, zoom, devtools)
# behind a settings object that Tauri does not surface. Pinned to the versions Tauri
# already resolves so the COM types stay identical instead of duplicated.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
